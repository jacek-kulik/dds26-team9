worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream order_backend {
        zone order_backend 64k;
        server order-web:5000 resolve;
        keepalive 256;
    }

    upstream stock_backend {
        zone stock_backend 64k;
        server stock-web:5000 resolve;
        keepalive 256;
    }

    upstream payment_backend {
        zone payment_backend 64k;
        server user-web:5000 resolve;
        keepalive 256;
    }

    server {
        listen 80;

        location /orders/ {
            proxy_pass http://order_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout invalid_header http_502 http_504;
        }

        location /stock/ {
            proxy_pass http://stock_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout invalid_header http_502 http_504;
        }

        location /payment/ {
            proxy_pass http://payment_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout invalid_header http_502 http_504;
        }
    }
}