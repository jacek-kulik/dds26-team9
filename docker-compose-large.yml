services:
  gateway:
    image: nginx:1.27-bookworm
    restart: always
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      order-web:
        condition: service_healthy
      stock-web:
        condition: service_healthy
      user-web:
        condition: service_healthy

  # ── Redis: separate instance per service + dedicated bus ───────────────────

  redis-order:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 256mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    volumes:
      - redis-order-data:/data

  redis-stock:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 256mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    volumes:
      - redis-stock-data:/data

  redis-payment:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 256mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    volumes:
      - redis-payment-data:/data

  redis-orchestrator:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 256mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    volumes:
      - redis-orchestrator-data:/data

  redis-bus:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 1gb --io-threads 7 --io-threads-do-reads yes
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "4"
          memory: 2G
    volumes:
      - redis-bus-data:/data

  # ── Order (scale with --scale order-web=<n> / --scale order-worker=<n>) ───

  order-web:
    build: ./order
    image: order:latest
    restart: always
    environment:
      - GATEWAY_URL=http://gateway:80
      - RUN_MODE=web
      - SERVICE_NAME=order
      - REDIS_HOST=redis-order
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level warn app:app
    deploy:
      replicas: 25
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - redis-order
      - redis-bus

  order-worker:
    build: ./order
    image: order:latest
    restart: always
    environment:
      - GATEWAY_URL=http://gateway:80
      - SERVICE_NAME=order
      - WORKER_COUNT=6
      - REDIS_HOST=redis-order
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: python worker_main.py
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    depends_on:
      - redis-order
      - redis-bus

  # ── Orchestrator: worker-only (no HTTP traffic, just health check) ─────────

  orchestrator-worker:
    build: ./orchestrator
    image: orchestrator:latest
    restart: always
    environment:
      - PROTOCOL=SAGA
      - SERVICE_NAME=orchestrator
      - WORKER_COUNT=6
      - REDIS_HOST=redis-orchestrator
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: python worker_main.py
    deploy:
      replicas: 25
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    depends_on:
      - redis-orchestrator
      - redis-bus

  # ── Stock (scale with --scale stock-web=<n> / --scale stock-worker=<n>) ───

  stock-web:
    build: ./stock
    image: stock:latest
    restart: always
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=stock
      - REDIS_HOST=redis-stock
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level warn app:app
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - redis-stock
      - redis-bus

  stock-worker:
    build: ./stock
    image: stock:latest
    restart: always
    environment:
      - SERVICE_NAME=stock
      - WORKER_COUNT=6
      - REDIS_HOST=redis-stock
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: python worker_main.py
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    depends_on:
      - redis-stock
      - redis-bus


  # ── Payment (scale with --scale user-web=<n> / --scale user-worker=<n>) ───

  user-web:
    build: ./payment
    image: user:latest
    restart: always
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=payment
      - REDIS_HOST=redis-payment
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level warn app:app
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - redis-payment
      - redis-bus

  user-worker:
    build: ./payment
    image: user:latest
    restart: always
    environment:
      - SERVICE_NAME=payment
      - WORKER_COUNT=6
      - REDIS_HOST=redis-payment
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis-bus
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=0
      - ORDER_TIMEOUT_SECONDS=20.0
      - PEL_TIMEOUT_SECONDS=3.5
      - PEL_SEARCH_INTERVAL_SECONDS=2.0
    command: python worker_main.py
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    depends_on:
      - redis-payment
      - redis-bus


volumes:
  redis-order-data:
  redis-stock-data:
  redis-payment-data:
  redis-orchestrator-data:
  redis-bus-data: