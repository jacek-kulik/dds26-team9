services:
  gateway:
    image: nginx:1.25-bookworm
    restart: unless-stopped
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      order-web:
        condition: service_healthy
      stock-web:
        condition: service_healthy
      user-web:
        condition: service_healthy

  # ── Single shared Redis (matches K8s redis-node-0) ─────────────────────────
  # Order=DB0, Stock=DB1, Payment=DB2, Bus=DB3
  redis:
    image: redis:8.6
    command: redis-server --requirepass redis --maxmemory 512mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Order (scale with --scale order-web=<n> / --scale order-worker=<n>) ───

  order-web:
    build: ./order
    image: order:latest
    restart: unless-stopped
    environment:
      - GATEWAY_URL=http://gateway:80
      - PROTOCOL=SAGA
      - RUN_MODE=web
      - SERVICE_NAME=order
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  order-worker:
    build: ./order
    image: order:latest
    restart: unless-stopped
    environment:
      - GATEWAY_URL=http://gateway:80
      - PROTOCOL=SAGA
      - SERVICE_NAME=order
      - WORKER_COUNT=6
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy

  # ── Stock (scale with --scale stock-web=<n> / --scale stock-worker=<n>) ───

  stock-web:
    build: ./stock
    image: stock:latest
    restart: unless-stopped
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=stock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=1
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  stock-worker:
    build: ./stock
    image: stock:latest
    restart: unless-stopped
    environment:
      - SERVICE_NAME=stock
      - WORKER_COUNT=6
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=1
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy

  # ── Payment (scale with --scale user-web=<n> / --scale user-worker=<n>) ───

  user-web:
    build: ./payment
    image: user:latest
    restart: unless-stopped
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=payment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=2
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  user-worker:
    build: ./payment
    image: user:latest
    restart: unless-stopped
    environment:
      - SERVICE_NAME=payment
      - WORKER_COUNT=6
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=2
      - BUS_REDIS_HOST=redis
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
