apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIP
  selector:
    component: user
  ports:
    - port: 5000
      name: http
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      component: user
  template:
    metadata:
      labels:
        component: user
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: user
          image: user:latest
          imagePullPolicy: Never
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          command: ["hypercorn"]
          args: ["-b", "0.0.0.0:5000", "-w", "4", "--graceful-timeout", "30", "--log-level=info", "app:app"]
          ports:
            - containerPort: 5000
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: SERVICE_NAME
              value: "payment"
            - name: REDIS_HOST
              value: redis-node-0.redis-headless.default.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              value: "redis"
            - name: REDIS_DB
              value: "2"
            - name: REDIS_SENTINEL_HOST
              value: redis.default.svc.cluster.local
            - name: REDIS_SENTINEL_PORT
              value: '26379'
            - name: REDIS_SENTINEL_MASTER
              value: "mymaster"
            - name: BUS_REDIS_HOST
              value: redis-node-0.redis-headless.default.svc.cluster.local
            - name: BUS_REDIS_PORT
              value: '6379'
            - name: BUS_REDIS_PASSWORD
              value: "redis"
            - name: BUS_REDIS_DB
              value: "3"
            - name: BUS_REDIS_SENTINEL_HOST
              value: redis.default.svc.cluster.local
            - name: BUS_REDIS_SENTINEL_PORT
              value: '26379'
            - name: BUS_REDIS_SENTINEL_MASTER
              value: "mymaster"
