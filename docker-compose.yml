services:
  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - order-web-1
      - order-web-2
      - order-web-3
      - order-web-4
      - stock-web-1
      - stock-web-2
      - user-web-1
      - user-web-2

  # ── Redis: 1 master + 2 replicas + 3 sentinels (matches K8s Helm chart) ───

  redis-master:
    image: redis:8.6
    command: redis-server --requirepass redis --masterauth redis --maxmemory 512mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 512M
    volumes:
      - redis-master-data:/data

  redis-replica-1:
    image: redis:8.6
    command: redis-server --replicaof redis-master 6379 --requirepass redis --masterauth redis --maxmemory 512mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 512M
    volumes:
      - redis-replica-1-data:/data
    depends_on:
      - redis-master

  redis-replica-2:
    image: redis:8.6
    command: redis-server --replicaof redis-master 6379 --requirepass redis --masterauth redis --maxmemory 512mb
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 512M
    volumes:
      - redis-replica-2-data:/data
    depends_on:
      - redis-master

  redis-sentinel-1: &sentinel
    image: redis:8.6
    entrypoint: [ "/bin/sh", "/etc/redis/sentinel-entrypoint.sh" ]
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel-ro.conf:ro
      - ./sentinel-entrypoint.sh:/etc/redis/sentinel-entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  redis-sentinel-2:
    <<: *sentinel

  redis-sentinel-3:
    <<: *sentinel

  # ── Order: 4 web + 4 worker ───────────────────────────────────────────────

  order-web-1: &order-web
    build: ./order
    image: order:latest
    environment:
      - GATEWAY_URL=http://gateway:80
      - PROTOCOL=SAGA
      - RUN_MODE=web
      - SERVICE_NAME=order
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 1G
    depends_on:
      - redis-master
      - redis-sentinel-1

  order-web-2:
    <<: *order-web

  order-web-3:
    <<: *order-web

  order-web-4:
    <<: *order-web

  order-worker-1: &order-worker
    build: ./order
    image: order:latest
    environment:
      - GATEWAY_URL=http://gateway:80
      - PROTOCOL=SAGA
      - SERVICE_NAME=order
      - WORKER_COUNT=6
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=0
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - redis-master
      - redis-sentinel-1

  order-worker-2:
    <<: *order-worker

  order-worker-3:
    <<: *order-worker

  order-worker-4:
    <<: *order-worker

  # ── Stock: 2 web + 4 worker ───────────────────────────────────────────────

  stock-web-1: &stock-web
    build: ./stock
    image: stock:latest
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=stock
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=1
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - redis-master
      - redis-sentinel-1

  stock-web-2:
    <<: *stock-web

  stock-worker-1: &stock-worker
    build: ./stock
    image: stock:latest
    environment:
      - SERVICE_NAME=stock
      - WORKER_COUNT=6
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=1
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - redis-master
      - redis-sentinel-1

  stock-worker-2:
    <<: *stock-worker

  stock-worker-3:
    <<: *stock-worker

  stock-worker-4:
    <<: *stock-worker

  # ── Payment: 2 web + 4 worker ─────────────────────────────────────────────

  user-web-1: &user-web
    build: ./payment
    image: user:latest
    environment:
      - RUN_MODE=web
      - SERVICE_NAME=payment
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=2
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: hypercorn -b 0.0.0.0:5000 -w 6 --graceful-timeout 30 --log-level info app:app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - redis-master
      - redis-sentinel-1

  user-web-2:
    <<: *user-web

  user-worker-1: &user-worker
    build: ./payment
    image: user:latest
    environment:
      - SERVICE_NAME=payment
      - WORKER_COUNT=6
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis
      - REDIS_DB=2
      - REDIS_SENTINEL_HOST=redis-sentinel-1
      - REDIS_SENTINEL_PORT=26379
      - REDIS_SENTINEL_MASTER=mymaster
      - BUS_REDIS_HOST=redis-master
      - BUS_REDIS_PORT=6379
      - BUS_REDIS_PASSWORD=redis
      - BUS_REDIS_DB=3
      - BUS_REDIS_SENTINEL_HOST=redis-sentinel-1
      - BUS_REDIS_SENTINEL_PORT=26379
      - BUS_REDIS_SENTINEL_MASTER=mymaster
    command: python worker_main.py
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - redis-master
      - redis-sentinel-1

  user-worker-2:
    <<: *user-worker

  user-worker-3:
    <<: *user-worker

  user-worker-4:
    <<: *user-worker

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data: